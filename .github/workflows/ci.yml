name: Worker Gateway tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run check
      - name: Windows PowerShell 5.1 bootstrap checks
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows\Test-WindowsBootstrap.ps1
      - name: Confirm upstream remains a gitlink
        shell: bash
        run: |
          test "$(git ls-files --stage upstream/t3-fleet-gateway | cut -d ' ' -f 1)" = 160000
          test -z "$(git -C upstream/t3-fleet-gateway status --porcelain)"
